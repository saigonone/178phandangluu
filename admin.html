<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS - Quản trị nội dung</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#1f2937}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#111827;color:#fff;padding:22px 14px;position:fixed;left:0;top:0;bottom:0}
.logo{font-size:20px;font-weight:800;padding:0 12px 25px}
.logo span{color:#60a5fa}
.nav button{width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px 14px;border-radius:9px;margin:3px 0}
.nav button:hover,.nav button.active{background:#1f2937;color:#fff}
.main{margin-left:240px;width:calc(100% - 240px);padding:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:26px;margin:0 0 5px}.sub{color:#6b7280;font-size:14px}
.btn{padding:10px 16px;border-radius:8px;background:#2563eb;color:#fff;font-weight:600}
.btn.secondary{background:#e5e7eb;color:#374151}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.small{padding:7px 10px;font-size:13px}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px}
.card .num{font-size:28px;font-weight:800;margin-top:8px}
.toolbar{display:flex;gap:10px;margin-bottom:16px}
.search{flex:1;padding:11px 13px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px;border-bottom:1px solid #eef0f3;font-size:14px}
th{background:#f9fafb;color:#6b7280;font-weight:700}
td.title{font-weight:700;color:#111827}
.actions{display:flex;gap:7px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.badge.pub{background:#dcfce7;color:#166534}.badge.draft{background:#fef3c7;color:#92400e}
.form-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;max-width:1100px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.field{margin-bottom:16px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;outline:none;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#2563eb}
textarea{min-height:350px;resize:vertical}
.editor-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.editor-toolbar button{background:#f3f4f6;padding:7px 10px;border-radius:6px}
.editor{min-height:350px;border:1px solid #d1d5db;border-radius:8px;padding:14px;background:#fff;outline:none}
.editor:focus{border-color:#2563eb}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.empty{text-align:center;padding:45px;color:#6b7280}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.info{font-size:13px;color:#6b7280;margin-top:5px}
@media(max-width:800px){
.sidebar{width:65px}.logo{font-size:0}.logo span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}
.main{margin-left:65px;width:calc(100% - 65px);padding:18px}.grid,.cat-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">CMS <span>EyeLife</span></div>
  <div class="nav">
    <button class="active" data-page="dashboard">📊 Dashboard</button>
    <button data-page="posts">📝 Bài viết</button>
    <button data-page="categories">📁 Danh mục</button>
  </div>
</aside>

<main class="main">
  <section id="dashboard" class="page active">
    <div class="topbar"><div><h1>Dashboard</h1><div class="sub">Quản lý nội dung website</div></div><button class="btn" onclick="showPostForm()">+ Viết bài mới</button></div>
    <div class="cards">
      <div class="card">Tổng bài viết<div class="num" id="statPosts">0</div></div>
      <div class="card">Đã xuất bản<div class="num" id="statPublished">0</div></div>
      <div class="card">Danh mục<div class="num" id="statCats">0</div></div>
    </div>
    <div class="card">
      <h3>Bài viết gần đây</h3>
      <div id="recentPosts"></div>
    </div>
  </section>

  <section id="posts" class="page">
    <div class="topbar"><div><h1>Bài viết</h1><div class="sub">Tạo và quản lý nội dung</div></div><button class="btn" onclick="showPostForm()">+ Viết bài mới</button></div>
    <div class="toolbar">
      <input id="postSearch" class="search" placeholder="Tìm kiếm bài viết..." oninput="renderPosts()">
      <select id="postFilter" class="search" style="max-width:180px" onchange="renderPosts()"><option value="">Tất cả trạng thái</option><option value="published">Đã xuất bản</option><option value="draft">Nháp</option></select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Ngày</th><th></th></tr></thead><tbody id="postTable"></tbody></table></div>
  </section>

  <section id="postForm" class="page">
    <div class="topbar"><div><h1 id="formTitle">Viết bài mới</h1><div class="sub">Nội dung bài viết</div></div></div>
    <div class="form-card">
      <input type="hidden" id="postId">
      <div class="grid">
        <div>
          <div class="field"><label>Tiêu đề bài viết *</label><input id="title" placeholder="Nhập tiêu đề..."></div>
          <div class="field"><label>Nội dung</label>
            <div class="editor-toolbar">
              <button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button>
              <button onclick="cmd('formatBlock','h2')">H2</button><button onclick="cmd('formatBlock','h3')">H3</button>
              <button onclick="cmd('insertUnorderedList')">• Danh sách</button><button onclick="cmd('createLink')">🔗 Link</button>
            </div>
            <div id="content" class="editor" contenteditable="true"></div>
          </div>
        </div>
        <div>
          <div class="field"><label>Danh mục</label><select id="category"></select></div>
          <div class="field"><label>Slug / URL</label><input id="slug" placeholder="vi-du-trong-kinh-1-74"></div>
          <div class="field"><label>Ảnh đại diện</label><input id="image" placeholder="https://.../anh.jpg"></div>
          <div class="field"><label>Trạng thái</label><select id="status"><option value="draft">Nháp</option><option value="published">Đã xuất bản</option></select></div>
          <hr>
          <div class="field"><label>SEO Title</label><input id="seoTitle" placeholder="Tiêu đề hiển thị trên Google"></div>
          <div class="field"><label>SEO Description</label><textarea id="seoDescription" style="min-height:120px" placeholder="Mô tả ngắn cho Google..."></textarea></div>
        </div>
      </div>
      <div class="form-actions"><button class="btn secondary" onclick="showPage('posts')">Hủy</button><button class="btn" onclick="savePost()">Lưu bài viết</button></div>
    </div>
  </section>

  <section id="categories" class="page">
    <div class="topbar"><div><h1>Danh mục</h1><div class="sub">Quản lý các nhóm nội dung</div></div></div>
    <div class="cat-grid">
      <div class="form-card">
        <h3 id="catFormTitle">Thêm danh mục</h3>
        <input type="hidden" id="catId">
        <div class="field"><label>Tên danh mục *</label><input id="catName" placeholder="Ví dụ: Kiến thức mắt kính"></div>
        <div class="field"><label>Slug</label><input id="catSlug" placeholder="kien-thuc-mat-kinh"></div>
        <button class="btn" onclick="saveCategory()">Lưu danh mục</button>
        <button class="btn secondary" onclick="resetCatForm()" style="margin-left:6px">Làm mới</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Tên danh mục</th><th>Slug</th><th>Số bài</th><th></th></tr></thead><tbody id="catTable"></tbody></table>
      </div>
    </div>
  </section>
</main>
</div>

<script>
const KEY_POSTS='eyelife_cms_posts', KEY_CATS='eyelife_cms_categories';
let posts=JSON.parse(localStorage.getItem(KEY_POSTS)||'[]');
let cats=JSON.parse(localStorage.getItem(KEY_CATS)||'[]');

if(!cats.length){
  cats=[
    {id:crypto.randomUUID(),name:'Kiến thức mắt kính',slug:'kien-thuc-mat-kinh'},
    {id:crypto.randomUUID(),name:'Tròng kính',slug:'trong-kinh'},
    {id:crypto.randomUUID(),name:'Gọng kính',slug:'gong-kinh'}
  ];
  persist();
}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));

function persist(){
  localStorage.setItem(KEY_POSTS,JSON.stringify(posts));
  localStorage.setItem(KEY_CATS,JSON.stringify(cats));
}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id || (id==='postForm'&&b.dataset.page==='posts')));
  if(id==='dashboard') renderDashboard();
  if(id==='posts') renderPosts();
  if(id==='categories') renderCats();
}
function slugify(s){
 return s.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function showPostForm(id=''){
 resetPostForm();
 document.getElementById('postId').value=id;
 populateCategory();
 if(id){
   const p=posts.find(x=>x.id===id); if(!p)return;
   document.getElementById('formTitle').textContent='Sửa bài viết';
   title.value=p.title; slug.value=p.slug; image.value=p.image||''; status.value=p.status;
   category.value=p.categoryId||''; seoTitle.value=p.seoTitle||''; seoDescription.value=p.seoDescription||'';
   content.innerHTML=p.content||'';
 }else document.getElementById('formTitle').textContent='Viết bài mới';
 showPage('postForm');
}
function resetPostForm(){
 ['postId','title','slug','image','seoTitle','seoDescription'].forEach(id=>document.getElementById(id).value='');
 content.innerHTML=''; status.value='draft';
}
title.addEventListener('input',()=>{if(!document.getElementById('postId').value) slug.value=slugify(title.value)});
function populateCategory(){
 category.innerHTML='<option value="">-- Chọn danh mục --</option>'+cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}
function savePost(){
 const t=title.value.trim(); if(!t){alert('Vui lòng nhập tiêu đề.');return}
 const id=document.getElementById('postId').value;
 const obj={id:id||crypto.randomUUID(),title:t,slug:slug.value.trim()||slugify(t),content:content.innerHTML,
 categoryId:category.value,image:image.value.trim(),status:status.value,seoTitle:seoTitle.value.trim()||t,
 seoDescription:seoDescription.value.trim(),updatedAt:new Date().toISOString()};
 if(id){posts=posts.map(p=>p.id===id?obj:p)}else posts.unshift(obj);
 persist(); showPage('posts');
}
function renderPosts(){
 const q=(postSearch.value||'').toLowerCase(), f=postFilter.value;
 const arr=posts.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(!f||p.status===f));
 postTable.innerHTML=arr.length?arr.map(p=>`<tr>
 <td class="title">${escapeHtml(p.title)}<div class="info">/${escapeHtml(p.slug)}</div></td>
 <td>${escapeHtml(cats.find(c=>c.id===p.categoryId)?.name||'Chưa phân loại')}</td>
 <td><span class="badge ${p.status==='published'?'pub':'draft'}">${p.status==='published'?'Đã xuất bản':'Nháp'}</span></td>
 <td>${new Date(p.updatedAt).toLocaleDateString('vi-VN')}</td>
 <td><div class="actions"><button class="btn small secondary" onclick="showPostForm('${p.id}')">Sửa</button><button class="btn small danger" onclick="deletePost('${p.id}')">Xóa</button></div></td>
 </tr>`).join(''):'<tr><td colspan="5" class="empty">Chưa có bài viết.</td></tr>';
}
function deletePost(id){if(confirm('Xóa bài viết này?')){posts=posts.filter(p=>p.id!==id);persist();renderPosts();renderDashboard()}}
function renderCats(){
 catTable.innerHTML=cats.map(c=>`<tr><td class="title">${escapeHtml(c.name)}</td><td>${escapeHtml(c.slug)}</td><td>${posts.filter(p=>p.categoryId===c.id).length}</td>
 <td><div class="actions"><button class="btn small secondary" onclick="editCat('${c.id}')">Sửa</button><button class="btn small danger" onclick="deleteCat('${c.id}')">Xóa</button></div></td></tr>`).join('');
}
function saveCategory(){
 const n=catName.value.trim();if(!n){alert('Vui lòng nhập tên danh mục.');return}
 const id=catId.value, obj={id:id||crypto.randomUUID(),name:n,slug:catSlug.value.trim()||slugify(n)};
 if(id)cats=cats.map(c=>c.id===id?obj:c);else cats.push(obj);
 persist();resetCatForm();renderCats();
}
catName.addEventListener('input',()=>{if(!catId.value)catSlug.value=slugify(catName.value)});
function editCat(id){const c=cats.find(x=>x.id===id);catId.value=c.id;catName.value=c.name;catSlug.value=c.slug;catFormTitle.textContent='Sửa danh mục'}
function resetCatForm(){catId.value='';catName.value='';catSlug.value='';catFormTitle.textContent='Thêm danh mục'}
function deleteCat(id){
 if(posts.some(p=>p.categoryId===id)){alert('Không thể xóa: danh mục này đang có bài viết.');return}
 if(confirm('Xóa danh mục này?')){cats=cats.filter(c=>c.id!==id);persist();renderCats()}
}
function renderDashboard(){
 statPosts.textContent=posts.length;statPublished.textContent=posts.filter(p=>p.status==='published').length;statCats.textContent=cats.length;
 const arr=posts.slice(0,5);
 recentPosts.innerHTML=arr.length?arr.map(p=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${escapeHtml(p.title)}</b><div class="info">${p.status==='published'?'Đã xuất bản':'Nháp'} · ${new Date(p.updatedAt).toLocaleDateString('vi-VN')}</div></div>`).join(''):'<div class="empty">Chưa có bài viết.</div>';
}
function cmd(command,value=null){
 if(command==='createLink'){const u=prompt('Nhập URL:');if(u)document.execCommand(command,false,u)}
 else document.execCommand(command,false,value);
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderDashboard();
</script>
</body>
</html>
